<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="shortcut icon" href="../imgs/logo-cruz.svg" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Dedicatória — Via Fidei</title>
</head>
<header>
    <div class="container">
        <nav class="navbar">
            <div class="logo-container">
                <a href="index.html" class="logo-link">
                    <img src="../imgs/logo-cruz.svg" alt="">
                    <div class="titulo">
                        <strong>Via Fidei</strong>
                        <small>Caminho da fé</small>
                    </div>
                </a>
            </div>
            <ul class="nav-links">
                <li class="nav-item">
                    <a class="active" href="index.html">Início</a>
                </li>
                <li class="nav-item">
                    <a href="historia.html">Nossa fé</a>
                </li>
                <li class="nav-item">
                    <a href="dedicatoria.html">Dedicatória</a>
                </li>
            </ul>
            <div class="buttons">
                <button class="btn-login">
                    <a href="login.html">Entrar</a>
                </button>
                <button class="btn-default btn-cadastro">
                    <a href="cadastro.html">Criar conta</a>
                </button>
            </div>
        </nav>
    </div>
</header>

<body>
    <main class="data-main">
        <div class="sacrament-layout">
            <form class="input-card">
                <span class="card-number">01</span>
                <h2>Marque o que já recebeu</h2>
                <div class="check-list">
                    <label><input type="checkbox" value="Batismo">Batismo</label>
                    <label><input type="checkbox" value="Crisma">Crisma</label>
                    <label><input type="checkbox" value="Eucaristia">Eucaristia</label>
                    <label><input type="checkbox" value="Reconciliação">Reconciliação</label>
                    <label><input type="checkbox" value="Unção">Unção</label>
                    <label><input type="checkbox" value="Ordem">Ordem</label>
                    <label><input type="checkbox" value="Matrimonio">Matrimônio</label>
                </div>
                <button type="submit">Salvar</button>
            </form>
            <section class="data-card">
                <span class="card-number">02</span>
                <h2>Seu caminho</h2>
                <div class="canvas-wrap radar">
                    <canvas id="sacrament-radar"></canvas>
                </div>
            </section>
        </div>
    </main>
</body>

</html>

<script>
  const ctx = document.getElementById('sacrament-radar');

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
      datasets: [{
        label: '# of Votes',
        data: [12, 19, 3, 5, 2, 3],
        borderWidth: 1
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
</script>
